<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="calculator">
        <header class="calculator-header">
            <h1>Calculator</h1>
            <p>Simple. Smart. Accurate.</p>
        </header>

        <section class="display-container" aria-label="Calculator display">
            <div id="previous-display" class="previous-display" aria-live="polite"></div>
            <div id="display" class="display" role="status" aria-live="polite">0</div>
        </section>

        <div class="keypad">
            <button type="button" class="utility" data-action="clear">AC</button>
            <button type="button" class="utility" data-action="backspace" aria-label="Backspace">⌫</button>
            <button type="button" class="operator" data-operator="/" aria-label="Divide">÷</button>
            <button type="button" class="operator" data-operator="*" aria-label="Multiply">×</button>

            <button type="button" data-number="7">7</button>
            <button type="button" data-number="8">8</button>
            <button type="button" data-number="9">9</button>
            <button type="button" class="operator" data-operator="-" aria-label="Subtract">−</button>

            <button type="button" data-number="4">4</button>
            <button type="button" data-number="5">5</button>
            <button type="button" data-number="6">6</button>
            <button type="button" class="operator" data-operator="+" aria-label="Add">+</button>

            <button type="button" data-number="1">1</button>
            <button type="button" data-number="2">2</button>
            <button type="button" data-number="3">3</button>
            <button type="button" class="equals" data-action="equals">=</button>

            <button type="button" class="zero" data-number="0">0</button>
            <button type="button" data-action="decimal">.</button>
            <button type="button" data-action="sign" aria-label="Change sign">±</button>
        </div>

        <p id="message" class="message" role="status" aria-live="polite"></p>

        <footer class="calculator-footer">
            <span>Keyboard supported</span>
            <span>© Calculator</span>
        </footer>
    </main>
</body>
</html>
